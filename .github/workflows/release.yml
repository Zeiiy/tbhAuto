name: Build & Release

# Declenche la construction de l'exe quand un tag "vX.Y.Z" est pousse,
# puis publie la release avec dist/TBHBot.exe attache.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install customtkinter pillow pyinstaller

      - name: Construire l'exe
        working-directory: backend
        run: pyinstaller --noconfirm --onefile --windowed --name TBHBot --collect-data customtkinter --add-data "templates;templates" gui.py

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/TBHBot.exe
          generate_release_notes: true
